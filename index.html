<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fcf9f5">
  <title>POPFLEX</title>
  <link rel="stylesheet" href="./vendor/framework7-bundle.min.css">
  <link rel="stylesheet" href="./vendor/framework7-icons.css">
  <link rel="stylesheet" href="./css/app.css">
</head>
<body>
  <div id="app">
    <!-- Menú lateral de Framework7 -->
    <div class="panel panel-left panel-cover">
      <div class="block"><h2>POPFLEX</h2></div>
      <div class="list links-list">
        <ul>
          <li><a href="/" class="panel-close">Home</a></li>
          <li><a href="/shop/" class="panel-close">Shop</a></li>
          <li><a href="/categories/" class="panel-close">Categories</a></li>
          <li><a href="/saved/" class="panel-close">Saved</a></li>
          <li><a href="/carrito/" class="panel-close">Your Cart</a></li>
          <li><a href="/account/" class="panel-close">My Account</a></li>
          <li><a href="/orders/" class="panel-close">My Orders</a></li>
          <li><a href="/about/" class="panel-close">About Us</a></li>
        </ul>
      </div>
    </div>

    <!-- Framework7 carga aquí las páginas -->
    <div class="view view-main view-init" data-url="/"></div>

    <!-- Ventanas sencillas de Framework7 para los enlaces secundarios -->
    <div class="popup popup-info">
      <div class="block">
        <a href="#" class="popup-close close-link">Close</a>
        <h2>POPFLEX preview</h2>
        <p>This is a class prototype. Account changes, payments and tracking are examples only.</p>
        <a href="#" class="button button-fill popup-close">GOT IT</a>
      </div>
    </div>
  </div>
  <script src="./vendor/framework7-bundle.min.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
